name: neara_family
description: Neara 照護機器人 家屬 App（收警報、看事件報告、管理長者資料）
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  cloud_functions: ^5.1.3
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  url_launcher: ^6.3.1
  intl: ^0.19.0
  agora_rtc_engine: ^6.3.2      # 視訊通話
  permission_handler: ^11.3.1   # 視訊要相機與麥克風權限

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
